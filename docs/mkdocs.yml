site_name: Kalligraphie
site_description: API and technical documentation for Kalligraphie
site_url: https://graphiks-org.github.io/Kalligraphie/
repo_url: https://github.com/Graphiks-org/Kalligraphie
repo_name: Graphiks-org/Kalligraphie

docs_dir: docs
site_dir: ../_site
use_directory_urls: false

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

markdown_extensions:
  - admonition
  - tables
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - Font Management: font-management.md
  - Platform Font Access: platform-font-access.md
  - Editable-line Measurement: editable-line-measurement.md
  - Glyph Materialization Measurement: glyph-materialization-measurement.md
  - Apple M2 Max Materialization Reference: glyph-materialization-reference-apple-m2-max.md
  - Conformance Matrix: conformance-matrix.md
  - Editable Paragraphs: editable-paragraphs.md
  - Incremental Layout Measurement: incremental-layout-measurement.md
  - Advanced Typography: advanced-typography.md
  - Raster CPU: raster-cpu.md

# !!! EMBEDDED DOKKA START, DO NOT COMMIT !!! #
# !!! EMBEDDED DOKKA END, DO NOT COMMIT !!! #

plugins:
  - search
  - i18n:
      languages:
        - locale: en
          name: English
          default: true
          build: true
        - locale: fr
          name: Français
          build: true
          site_name: Kalligraphie
          site_description: Documentation technique pour Kalligraphie
